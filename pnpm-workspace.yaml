packages:
  - packages/*
  - apps/*
# pnpm 12 ignored-builds 显式裁决：@parcel/watcher（file-viewer 可选依赖）与
# protobufjs 的安装脚本均不必要（纯 JS 可用），不允许跑（防供应链面扩大）
allowBuilds:
  '@parcel/watcher': false
  onnxruntime-node: set this to true or false
  protobufjs: false
minimumReleaseAgeExclude:
  - lucide-react@1.65.0
  - '@univerjs/core@1.3.1'
  - '@univerjs/design@1.3.1'
  - '@univerjs/docs-ui@1.3.1'
  - '@univerjs/docs@1.3.1'
  - '@univerjs/drawing@1.3.1'
  - '@univerjs/engine-formula@1.3.1'
  - '@univerjs/engine-render@1.3.1'
  - '@univerjs/network@1.3.1'
  - '@univerjs/preset-sheets-core@1.3.1'
  - '@univerjs/presets@1.3.1'
  - '@univerjs/protocol@1.3.1'
  - '@univerjs/rpc@1.3.1'
  - '@univerjs/sheets-formula-ui@1.3.1'
  - '@univerjs/sheets-formula@1.3.1'
  - '@univerjs/sheets-numfmt-ui@1.3.1'
  - '@univerjs/sheets-numfmt@1.3.1'
  - '@univerjs/sheets-ui@1.3.1'
  - '@univerjs/sheets@1.3.1'
  - '@univerjs/telemetry@1.3.1'
  - '@univerjs/themes@1.3.1'
  - '@univerjs/ui@1.3.1'
  - '@tiptap/core@3.32.2'
  - '@tiptap/extension-blockquote@3.32.2'
  - '@tiptap/extension-bold@3.32.2'
  - '@tiptap/extension-bullet-list@3.32.2'
